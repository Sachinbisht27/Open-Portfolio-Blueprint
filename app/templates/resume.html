{% extends "base.html" %}

{% block content %}
<section class="section page-hero">
    <div>
        <p class="eyebrow">{{ t('resume.eyebrow') }}</p>
        <h1>{{ t('resume.heading') }}</h1>
        <p class="lead">{{ t('resume.lead') }}</p>
    </div>
</section>

<section class="section">
    <div class="contact-card resume-card">
        <div>
            <h3>{{ t('resume.card_title') }}</h3>
            <p>{{ t('resume.card_description') }}</p>
        </div>
        <div class="contact-actions">
            <a class="btn primary" href="mailto:{{ site.resume.email }}">{{ t('resume.email_action') }}</a>
            <a class="btn ghost" href="{{ lang_url('home') }}#home">{{ t('resume.home_action') }}</a>
        </div>
    </div>
</section>
{% endblock %}
