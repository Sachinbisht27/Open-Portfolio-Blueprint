<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f7f3ee"/>
  
  <!-- Laptop -->
  <rect x="80" y="180" width="240" height="140" rx="8" fill="#1f3b5b"/>
  <rect x="90" y="190" width="220" height="110" fill="#0a1628"/>
  
  <!-- Code Lines -->
  <rect x="100" y="200" width="60" height="4" rx="2" fill="#f26430"/>
  <rect x="165" y="200" width="40" height="4" rx="2" fill="#58a6ff"/>
  <rect x="100" y="215" width="80" height="4" rx="2" fill="#58a6ff"/>
  <rect x="185" y="215" width="50" height="4" rx="2" fill="#f26430"/>
  <rect x="110" y="230" width="70" height="4" rx="2" fill="#10b981"/>
  <rect x="185" y="230" width="60" height="4" rx="2" fill="#58a6ff"/>
  <rect x="100" y="245" width="90" height="4" rx="2" fill="#f26430"/>
  <rect x="110" y="260" width="60" height="4" rx="2" fill="#58a6ff"/>
  <rect x="175" y="260" width="70" height="4" rx="2" fill="#10b981"/>
  <rect x="100" y="275" width="50" height="4" rx="2" fill="#f26430"/>
  
  <!-- Laptop Base -->
  <path d="M60 320 L340 320 L350 340 L50 340 Z" fill="#1f3b5b"/>
  
  <!-- Floating Elements -->
  <!-- Circle 1 -->
  <circle cx="320" cy="100" r="30" fill="#f26430" opacity="0.2"/>
  <circle cx="320" cy="100" r="20" fill="#f26430" opacity="0.4"/>
  
  <!-- Circle 2 -->
  <circle cx="80" cy="120" r="25" fill="#58a6ff" opacity="0.2"/>
  <circle cx="80" cy="120" r="15" fill="#58a6ff" opacity="0.4"/>
  
  <!-- Geometric Shapes -->
  <rect x="300" y="240" width="40" height="40" rx="4" fill="#10b981" opacity="0.3" transform="rotate(15 320 260)"/>
  <rect x="40" y="260" width="35" height="35" rx="4" fill="#f26430" opacity="0.3" transform="rotate(-20 57.5 277.5)"/>
  
  <!-- Tech Icons -->
  <!-- Brackets -->
  <path d="M340 150 L350 160 L340 170" stroke="#1f3b5b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M360 150 L350 160 L360 170" stroke="#1f3b5b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Code Symbol -->
  <text x="50" y="80" font-family="monospace" font-size="40" fill="#1f3b5b" opacity="0.5">&lt;/&gt;</text>
  
  <!-- Coffee Cup -->
  <rect x="340" y="300" width="30" height="35" rx="4" fill="#1f3b5b"/>
  <ellipse cx="355" cy="300" rx="15" ry="5" fill="#1f3b5b"/>
  <rect x="345" y="305" width="20" height="25" fill="#f26430" opacity="0.3"/>
  
  <!-- Decorative Lines -->
  <line x1="200" y1="60" x2="250" y2="60" stroke="#f26430" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="80" x2="180" y2="80" stroke="#58a6ff" stroke-width="2" opacity="0.5"/>
</svg>
